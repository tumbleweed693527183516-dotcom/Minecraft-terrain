name: World test

# Generates a real world with Vivid Lands on a Fabric 1.20.1 server and saves maps of it.
on:
  workflow_dispatch:

permissions:
  contents: write
    inputs:
      seed:
        description: World seed
        default: "vividlands"
      radius:
        description: Radius to generate, in blocks
        default: "2048"

jobs:
  worldtest:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build mod
        run: |
          pip install numpy
          python3 tools/generate.py
          python3 tools/check.py
          gradle build --no-daemon
      - name: Set up server
        env:
          SEED: ${{ inputs.seed }}
        run: |
          mkdir -p server/mods && cd server
          curl -fsSL -o server.jar https://meta.fabricmc.net/v2/versions/loader/1.20.1/0.16.10/1.0.1/server/jar
          dl() {
            url=$(curl -fsSL "https://api.modrinth.com/v2/project/$1/version?game_versions=%5B%221.20.1%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].files[0].url')
            echo "$1 -> $url"
            curl -fsSL -o "mods/$1.jar" "$url"
          }
          dl fabric-api
          dl chunky
          dl lithium
          cp ../build/libs/vividlands-$(cat ../VERSION).jar mods/
          echo "eula=true" > eula.txt
          printf "level-seed=%s\nonline-mode=false\nview-distance=4\nsimulation-distance=4\nspawn-protection=0\nmax-tick-time=-1\nsync-chunk-writes=false\n" "$SEED" > server.properties
      - name: Generate world
        run: bash tools/worldtest/run_server.sh "${{ inputs.radius }}"
      - name: Collect errors
        if: always()
        run: |
          mkdir -p out
          cp server/server.log out/ 2>/dev/null || true
          grep -nE "ERROR|Exception|Caused by|Feature order|Failed to|WARN.*(worldgen|biome|feature|density)" server/server.log > out/problems.txt 2>/dev/null || true
          wc -l out/problems.txt || true
          head -n 60 out/problems.txt || true
      - name: Extract maps
        run: python3 tools/worldtest/extract.py server/world out
      - name: Render maps
        if: always()
        run: |
          pip install pillow matplotlib
          python3 tools/worldtest/render.py out src/main/resources/data || true
      - name: Publish results to the worldtest-results branch
        if: always()
        run: |
          mkdir -p results && cp out/*.png out/*.txt results/ 2>/dev/null || true
          tail -n 400 out/server.log > results/server_tail.log 2>/dev/null || true
          cd results
          git init -q && git checkout -q -b worldtest-results
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "World test ${{ github.run_id }} (seed ${{ inputs.seed }})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" worldtest-results
