name: Fetch mountain stamps

# Downloads real elevation data and bakes mountain stamps (run by hand when stamps change).
on:
  workflow_dispatch:

jobs:
  stamps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pillow
      - run: python3 tools/stamps/fetch_stamps.py out/stamps
      - uses: actions/upload-artifact@v4
        with:
          name: stamps
          path: out/stamps/
