name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate world data
        run: python3 tools/generate.py
      - name: Check references
        run: python3 tools/check.py
      - name: Package mod and datapack
        run: |
          python3 tools/build.py
          python3 tools/testpack.py
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-lands
          path: build/*
