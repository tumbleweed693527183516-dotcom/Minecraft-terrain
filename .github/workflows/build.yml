name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Generate world data
        run: python3 tools/generate.py
      - name: Check references
        run: python3 tools/check.py
      - name: Compile mod
        run: |
          set -o pipefail
          gradle build --no-daemon --console=plain 2>&1 | tee build.log
      - name: Modpack
        run: |
          set -o pipefail
          python3 tools/modpack.py 2>&1 | tee modpack.log
      - uses: actions/upload-artifact@v4
        with:
          name: vivid-lands
          path: |
            build/libs/vividlands-*.jar
            ragnarok/build/libs/vividlands_ragnarok-*.jar
            build/*.mrpack
      - name: Publish jar and test pack to the dist branch
        if: success()
        run: |
          mkdir -p dist && cp build/libs/vividlands-$(cat VERSION).jar ragnarok/build/libs/vividlands_ragnarok-$(cat VERSION).jar build/*.mrpack dist/
          cd dist && git init -q && git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Build ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" dist
      - name: Publish build log to the build-logs branch
        if: always()
        run: |
          mkdir -p logs && cp build.log modpack.log logs/ 2>/dev/null || echo "no build log" > logs/build.log
          echo "${{ job.status }} $(git rev-parse --short HEAD)" > logs/status.txt
          cd logs && git init -q && git checkout -q -b build-logs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Build log ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-logs
